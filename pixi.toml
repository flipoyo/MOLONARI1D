[project]
name = "molonari1d"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.10,<3.14"
pytest = "*"
nbmake = "*"
pyqt = "*"
pandas = "*"
scipy = "*"
matplotlib = "*"
setuptools = "*"

# Les tests de pyheatmy sont dans MOLONARI-computo (`pixi run test-all` de ce dépôt) ;
# le twin fige pyheatmy dans Molonaviz/molonari_desk/uv.lock.
[pypi-dependencies]
molonaviz = { path = "Molonaviz", editable = true }

[tasks]
validate-molonaviz-structure = "cd Molonaviz/src && python -c \"import molonaviz; print('Molonaviz structure validated')\""
test-all = { depends-on = ["validate-molonaviz-structure"] }
