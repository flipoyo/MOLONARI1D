# Environment of the MOLONARI1D repository on its own: it needs no other repository of the Operating Space.
# Molonaviz, the twin and SIMU are brought by `cgitsync bootstrap .config/molonari.cgs`; their environment and tasks
# belong to the Operating Space, not to this file.
[workspace]
name = "molonari1d"
version = "1.0.10"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11,<3.14"  # ComplexGitSync needs 3.11
git = "*"

[pypi-dependencies]
# cgitsync, the tool that recomposes the Operating Space; pixi.lock pins its commit
complexgitsync = { git = "https://github.com/flipoyo/ComplexGitSync.git", branch = "main" }

[tasks]
# recompose / update / inspect the Operating Space: pixi run molo load .config/molonari.cgs (see scripts/molo.py)
molo = "python scripts/molo.py"
# SemVer of this repository: pixi.toml is the reference, see scripts/bump_version.py
bump-version = "python scripts/bump_version.py"
check-version = "python scripts/bump_version.py --check"
# the shell scripts parse; they run only inside the Operating Space
check-scripts = "bash -n scripts/simu_direct.sh && bash -n scripts/demo_lundi.sh"
check-molo = "python scripts/molo.py --help > /dev/null && cgitsync --version"
test-all = { depends-on = ["check-version", "check-scripts", "check-molo"] }
